apiVersion: apps/v1
kind: Deployment
metadata:
    name: frontend-green
    namespace: production
spec:
    replicas: 1
    selector:
        matchLabels:
            app: frontend
            version: green
    template:
        metadata:
            labels:
                app: frontend
                version: green
        spec:
            containers:
                - name: frontend
                  image: placeholder
                  imagePullPolicy: Always
                  ports:
                      - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
    name: frontend
    namespace: production
spec:
    type: ClusterIP
    selector:
        app: frontend
        version: green
    ports:
        - port: 80
          targetPort: 80
